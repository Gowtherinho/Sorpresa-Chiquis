<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una sorpresa muy especial ❤️</title>
  
  <!-- Librería para el efecto de confeti y serpentinas de fiesta -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 14px;
      background: linear-gradient(135deg, #fb7185 0%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 1.05rem;
      color: #e2e8f0;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .btn-surprise {
      background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%);
      color: #ffffff;
      border: none;
      padding: 18px 36px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: pulse 2s infinite;
    }

    .btn-surprise:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(244, 63, 94, 0.6);
    }

    .btn-surprise:active {
      transform: scale(0.95);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.6); }
      70% { box-shadow: 0 0 0 18px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    .reveal-section {
      display: none;
      margin-top: 10px;
    }

    /* Animación especial para mostrar la imagen */
    .pop-in {
      animation: popIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.5) rotate(-3deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    .ticket-img {
      width: 100%;
      border-radius: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.6);
      margin-bottom: 22px;
    }

    .message {
      font-size: 1.2rem;
      color: #f8fafc;
      font-weight: 600;
      line-height: 1.5;
    }

    .highlight {
      color: #fb7185;
      font-size: 1.3rem;
      display: block;
      margin-top: 6px;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.95rem;
      color: #f43f5e;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="cover-section">
      <h1>Tengo una sorpresa para ti ✨</h1>
      <p class="subtitle">Preparé este detalle especial porque no podía aguantar la emoción de contártelo...</p>
      <button class="btn-surprise" onclick="mostrarSorpresa()">Ver sorpresa 🎁</button>
    </div>

    <div id="reveal-section" class="reveal-section">
      <!-- Nombre exacto del archivo subido en tu repositorio -->
      <img src="imagen_grupo_frontera.jpg.jpeg" alt="Iremos a ver a Grupo Frontera" class="ticket-img">
      <p class="message">
        ¡Nos vamos juntos!
        <span class="highlight">🤠 GRUPO FRONTERA 🎶</span>
      </p>
      <p class="footer-note">¡Prepara la voz para cantar el 18 de Diciembre en MTY! ❤️</p>
    </div>
  </div>

  <script>
    function mostrarSorpresa() {
      // Oculta la portada y muestra la revelación
      document.getElementById('cover-section').style.display = 'none';
      
      const reveal = document.getElementById('reveal-section');
      reveal.style.display = 'block';
      reveal.classList.add('pop-in');

      // Lanzar serpentinas y confeti de fiesta
      lanzarConfetti();
    }

    function lanzarConfetti() {
      // Ráfaga central inicial
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      // Lluvia de serpentinas desde los lados
      var duration = 3 * 1000;
      var end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 4,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#f43f5e', '#fb7185', '#ffffff', '#fbbf24']
        });
        confetti({
          particleCount: 4,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#f43f5e', '#fb7185', '#ffffff', '#fbbf24']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }
  </script>

</body>
</html>
